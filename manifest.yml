modules:
  jira:globalPage:
    - key: quake3-multiplayer-jira
      resource: quake3
      title: Quake III Arena
  jira:issueGlance:
    - key: quake3-glance
      resource: quake3
      label: Quake III
      title: Play Quake III
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-glance-icon.svg
  confluence:globalPage:
    - key: quake3-multiplayer-confluence
      resource: quake3
      title: Quake III Arena
      route: quake3
app:
  licensing:
    enabled: false
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/063e7146-9980-4638-a24c-97852f4f702b
permissions:
  scopes: [ storage:app ]
  external:
    fetch:
      client:
        - address: "wss://*.trycloudflare.com"
          inScopeEUD: false
  content:
    scripts:
      - 'unsafe-eval'
resources:
  - key: quake3
    path: static/quake3
