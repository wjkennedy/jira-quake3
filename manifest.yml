modules:
  jira:globalPage:
    - key: quake3-game-jira
      resource: quake3
      title: Quake III Arena
  jira:issueGlance:
    - key: quake3-glance
      resource: quake3
      label: Quake III
      title: Play Quake III
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-glance-icon.svg
  confluence:globalPage:
    - key: quake3-game-confluence
      resource: quake3
      title: Quake III Arena
      route: quake3
  webtrigger:
    - key: q3-signaling
      function: q3-signaling-fn
      events:
        - http
  function:
    - key: q3-signaling-fn
      handler: signaling.run
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/7069de3a-a214-4d2a-8f03-481358dc171a
permissions:
  scopes: [storage:app]
  external:
    fetch:
      client:
        - address: "wss://hidden-parks-automation-rail.trycloudflare.com"
          inScopeEUD: false
  content:
    scripts:
      - 'unsafe-eval'
resources:
  - key: quake3
    path: static/quake3
